name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: GUI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke.py

      - name: Build portable executable
        run: pyinstaller --noconfirm --clean DigitalLibrary.spec

      - name: Portable application self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\DigitalLibrary.exe" `
            -ArgumentList "--self-test" -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            throw "Packaged application self-test timed out"
          }
          if ($process.ExitCode -ne 0) {
            Get-Content dist\logs\*.log -ErrorAction SilentlyContinue | Select-Object -Last 80
            throw "Packaged application self-test failed with exit code $($process.ExitCode)"
          }

      - name: Build installed folder
        run: pyinstaller --noconfirm --clean --distpath dist\installed DigitalLibraryInstalled.spec

      - name: Installed application self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\installed\DigitalLibrary\DigitalLibrary.exe" `
            -ArgumentList "--self-test" -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            throw "Installed build self-test timed out"
          }
          if ($process.ExitCode -ne 0) {
            Get-Content dist\installed\DigitalLibrary\logs\*.log -ErrorAction SilentlyContinue |
              Select-Object -Last 80
            throw "Installed build self-test failed with exit code $($process.ExitCode)"
          }
          # The self-test writes a library next to the exe; that must never end
          # up inside the installer or the update package.
          foreach ($folder in @("data", "logs", "thumbnails", "custom_covers", "fallback_covers")) {
            Remove-Item -Recurse -Force "dist\installed\DigitalLibrary\$folder" -ErrorAction SilentlyContinue
          }

      - name: Build setup, portable and update packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content config.py | Select-String 'APP_VERSION = "([^"]+)"').Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\DigitalLibrary.exe "release\DigitalLibrary-$version-windows-x64.exe"

          # 1) Setup program (installed edition) --------------------------
          choco install nsis --yes --no-progress | Out-Null
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = (Get-Command makensis).Source
          }
          $setup = Join-Path $PWD "build\installer\DigitalLibrary-$version-Setup.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $setup) | Out-Null
          & $makensis "/DVERSION=$version" "/DSRCDIR=$PWD\dist\installed\DigitalLibrary" `
            "/DOUTFILE=$setup" installer\DigitalLibrary.nsi
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $setup)) {
            throw "the setup program could not be built"
          }
          Compress-Archive -LiteralPath $setup -DestinationPath "release\DigitalLibrary-$version-setup.zip"

          # 2) Update package: only the files that differ from the old release
          $previousZip = ""
          $releases = gh release list --limit 20 --json tagName,publishedAt | ConvertFrom-Json
          $previous = $releases |
            Where-Object { $_.tagName -ne "v$version" } |
            Sort-Object publishedAt -Descending |
            Select-Object -First 1
          if ($previous) {
            $assets = gh release view $previous.tagName --json assets | ConvertFrom-Json
            $asset = $assets.assets |
              Where-Object { $_.name -like "*-update.zip" } |
              Select-Object -First 1
            if ($asset) {
              New-Item -ItemType Directory -Force -Path build\previous-update | Out-Null
              gh release download $previous.tagName --pattern $asset.name --dir build\previous-update
              $previousZip = (Get-ChildItem build\previous-update\*.zip | Select-Object -First 1).FullName
            }
          }
          $buildArgs = @(
            "scripts\build_update_package.py",
            "--dist", "dist\installed\DigitalLibrary",
            "--version", $version,
            "--output", "release\DigitalLibrary-$version-windows-x64-update.zip"
          )
          if ($previousZip) { $buildArgs += @("--previous", $previousZip) }
          python @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "the update package could not be built" }

          # 3) Checksums for every published file
          $lines = foreach ($file in (Get-ChildItem release\*.exe, release\*.zip)) {
            "{0}  {1}" -f (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower(), $file.Name
          }
          $lines | Out-File -FilePath release\SHA256.txt -Encoding ascii
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalLibrary-windows-x64
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: DigitalLibrary-windows-x64
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(basename release/DigitalLibrary-*-windows-x64-update.zip | sed -E 's/^DigitalLibrary-([0-9]+\.[0-9]+\.[0-9]+)-windows-x64-update\.zip$/\1/')"
          TAG="v${VERSION}"
          cat > notes.md <<'EOF'
          Digital Library for Windows x64. Three downloads:

          - **Setup (ZIP)** - recommended. It contains DigitalLibrary-Setup.exe. The wizard installs the app under Program Files, adds Start Menu and desktop shortcuts and registers a normal uninstaller. The installed app updates itself in place.
          - **Portable (EXE)** - one file, nothing to install. Put it anywhere and run it; the library data stays next to it.
          - **Update (ZIP)** - only for an installed copy. It contains just the files that changed. Installed copies find it by themselves: open the app and accept the update.

          The executable is not code-signed, so Windows SmartScreen may show a warning the first time (More info -> Run anyway).

          SHA256 checksums of every file are attached as SHA256.txt.

          ---

          نسخه ویندوز ۶۴ بیتی، سه فایل:

          - **فایل فشردهٔ Setup** - پیشنهادی. برنامه نصب حرفه‌ای داخلش است، در Program Files نصب می‌شود، میان‌بر می‌سازد و حذف‌کنندهٔ استاندارد دارد. نسخهٔ نصبی خودش را در جا آپدیت می‌کند.
          - **نسخهٔ Portable** - یک فایل اجرایی، بدون نصب.
          - **فایل آپدیت** - فقط برای نسخهٔ نصبی و فقط شامل فایل‌هایی که عوض شده‌اند. برنامه خودش پیدایش می‌کند.

          کد فایل‌ها در SHA256.txt آمده است.
          EOF
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "${GITHUB_SHA}" \
              --title "Digital Library ${VERSION}" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
